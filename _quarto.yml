project:
  type: book
  output-dir: _book

book:
  title: "데이터구축실습"
  author: "신기홍"
  search: true
  page-footer:
    left: "데이터구축실습 · Data Preparation Practice"
    right: "© 2026 신기홍"
  chapters:
    - index.qmd
    - part: "1주차 · 데이터 파이프라인과 품질의 이해"
      chapters: [week01_lecture.qmd, week01_quiz.qmd, week01_code.qmd]
    - part: "2주차 · 데이터 수집 전략과 데이터 소스"
      chapters: [week02_lecture.qmd, week02_quiz.qmd, week02_code.qmd, week02_appendix.qmd]
    - part: "3주차 · 웹 크롤링과 API 수집 실습"
      chapters: [week03_lecture.qmd, week03_quiz.qmd, week03_code.qmd]
    - part: "4주차 · 데이터 파이프라인 패턴과 적재"
      chapters: [week04_lecture.qmd, week04_quiz.qmd, week04_code.qmd]
    - part: "5주차 · 탐색적 데이터 분석(EDA)과 품질 점검"
      chapters: [week05_lecture.qmd, week05_quiz.qmd, week05_code.qmd]
    - part: "6주차 · 데이터 정제와 변환"
      chapters: [week06_lecture.qmd, week06_quiz.qmd, week06_code.qmd]
    - part: "7주차 · 데이터 품질 검증과 자동화"
      chapters: [week07_lecture.qmd, week07_quiz.qmd, week07_code.qmd]
    - part: "8주차 · 파이프라인 통합 실습"
      chapters: [week08_lecture.qmd, week08_quiz.qmd, week08_code.qmd]
    - part: "9주차 · 학습데이터 구축과 라벨링 개념"
      chapters: [week09_lecture.qmd, week09_quiz.qmd, week09_code.qmd]
    - part: "10주차 · 이미지 라벨링"
      chapters: [week10_lecture.qmd, week10_quiz.qmd, week10_code.qmd]
    - part: "11주차 · 텍스트·시계열 라벨링"
      chapters: [week11_lecture.qmd, week11_quiz.qmd, week11_code.qmd]
    - part: "12주차 · 데이터셋 검증과 편향 점검"
      chapters: [week12_lecture.qmd, week12_quiz.qmd, week12_code.qmd]
    - part: "13주차 · 모델링 준비(인코딩·스케일링·특성공학)"
      chapters: [week13_lecture.qmd, week13_quiz.qmd, week13_code.qmd]
    - part: "14주차 · Baseline 모델링과 성능 평가"
      chapters: [week14_lecture.qmd, week14_quiz.qmd, week14_code.qmd]
    - part: "15주차 · 최종 모델 평가와 데이터셋 완성"
      chapters: [week15_lecture.qmd, week15_quiz.qmd, week15_code.qmd]

crossref:
  fig-title: "그림"
  tbl-title: "표"
  fig-prefix: "그림"
  tbl-prefix: "표"
  eq-prefix: "식"
  sec-prefix: "절"
  title-delim: "."

format:
  html:
    theme:
      light: [cosmo, styles.scss]
    lang: ko
    toc: true
    toc-title: "목차"
    toc-depth: 3
    number-sections: true
    number-depth: 2
    code-copy: true
    code-overflow: wrap
    highlight-style: github
    fig-cap-location: bottom
    tbl-cap-location: top
    fig-align: center
    fig-format: png
    html-math-method: mathjax
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
    include-after-body: interactive.html
    mermaid:
      theme: neutral

execute:
  freeze: auto
  warning: false
  echo: false

lang: ko
