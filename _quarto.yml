project:
  type: book
  output-dir: _book

book:
  title: "데이터구축실습"
  search: true
  page-footer:
    left: "데이터구축실습 · Data Preparation Practice"
    right: "© 2026 신기홍"
  chapters:
    - index.qmd
    - part: "1주차 · 데이터 파이프라인과 품질의 이해"
      chapters: [week01-theory.qmd, week01-quiz.qmd, week01-lab.qmd]
    - part: "2주차 · 데이터 수집 전략과 데이터 소스"
      chapters: [week02-theory.qmd, week02-quiz.qmd, week02-lab.qmd]
    - part: "3주차 · 웹 크롤링과 API 수집 실습"
      chapters: [week03-theory.qmd, week03-quiz.qmd, week03-lab.qmd]
    - part: "4주차 · 데이터 파이프라인 패턴과 적재"
      chapters: [week04-theory.qmd, week04-quiz.qmd, week04-lab.qmd]
    - part: "5주차 · 탐색적 데이터 분석(EDA)과 품질 점검"
      chapters: [week05-theory.qmd, week05-quiz.qmd, week05-lab.qmd]
    - part: "6주차 · 데이터 정제와 변환"
      chapters: [week06-theory.qmd, week06-quiz.qmd, week06-lab.qmd]
    - part: "7주차 · 데이터 품질 검증과 자동화"
      chapters: [week07-theory.qmd, week07-quiz.qmd, week07-lab.qmd]
    - part: "8주차 · 파이프라인 통합 실습"
      chapters: [week08-theory.qmd, week08-quiz.qmd, week08-lab.qmd]
    - part: "9주차 · 학습데이터 구축과 라벨링 개념"
      chapters: [week09-theory.qmd, week09-quiz.qmd, week09-lab.qmd]
    - part: "10주차 · 이미지 라벨링"
      chapters: [week10-theory.qmd, week10-quiz.qmd, week10-lab.qmd]
    - part: "11주차 · 텍스트·시계열 라벨링"
      chapters: [week11-theory.qmd, week11-quiz.qmd, week11-lab.qmd]
    - part: "12주차 · 데이터셋 검증과 편향 점검"
      chapters: [week12-theory.qmd, week12-quiz.qmd, week12-lab.qmd]
    - part: "13주차 · 모델링 준비(인코딩·스케일링·특성공학)"
      chapters: [week13-theory.qmd, week13-quiz.qmd, week13-lab.qmd]
    - part: "14주차 · Baseline 모델링과 성능 평가"
      chapters: [week14-theory.qmd, week14-quiz.qmd, week14-lab.qmd]
    - part: "15주차 · 최종 모델 평가와 데이터셋 완성"
      chapters: [week15-theory.qmd, week15-quiz.qmd, week15-lab.qmd]
    - references.qmd

bibliography: references.bib

crossref:
  fig-title: "그림"
  tbl-title: "표"
  fig-prefix: "그림"
  tbl-prefix: "표"
  eq-prefix: "식"
  sec-prefix: "절"
  title-delim: "."

format:
  html:
    theme:
      light: [cosmo, styles.scss]
    lang: ko
    toc: true
    toc-title: "목차"
    toc-depth: 3
    number-sections: true
    number-depth: 2
    code-copy: true
    code-overflow: wrap
    highlight-style: github
    fig-cap-location: bottom
    tbl-cap-location: top
    fig-align: center
    fig-format: png
    html-math-method: mathjax
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
    include-after-body: interactive.html
    mermaid:
      theme: neutral

execute:
  freeze: auto
  warning: false
  echo: false

lang: ko
